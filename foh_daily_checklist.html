:root {
  --black:        #000000;
  --white:        #ffffff;
  --sky:          #87CEEB;
  --sky-light:    #EEF8FF;
  --gray-dark:    #1a1a1a;
  --gray-mid:     #666666;
  --gray-light:   #f5f5f5;
  --gray-border:  #e0e0e0;
  --success:      #2ecc71;
  --warning-bg:   #fffcf0;
  --warning-acc:  #f59e0b;
  --topbar-h:     56px;
  --transition:   0.2s ease;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; -webkit-text-size-adjust: 100%; }
body { font-family: 'Montserrat', sans-serif; background: var(--gray-light); color: var(--black); min-height: 100vh; padding-top: var(--topbar-h); }
button { font-family: inherit; }

/* --- TOP BAR --- */
.topbar { position: fixed; top: 0; left: 0; right: 0; height: var(--topbar-h); background: var(--black); display: flex; align-items: center; justify-content: space-between; padding: 0 16px 0 20px; z-index: 1000; border-bottom: 2px solid var(--sky); }
.topbar-brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-brand .wordmark { font-family: 'Kessel Heavy', sans-serif; font-size: 22px; color: var(--sky); letter-spacing: 3px; line-height: 1.2; flex-shrink: 0; }
.topbar-brand .doc-name { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--gray-mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.tb-pill { display: flex; align-items: center; gap: 6px; background: #111; border: 1px solid #2a2a2a; border-radius: 20px; padding: 4px 11px; cursor: pointer; transition: border-color 0.2s; position: relative; }
.tb-pill:hover { border-color: var(--sky); }
.tb-pill .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sky); flex-shrink: 0; }
.tb-pill .pill-text { font-size: 10px; font-weight: 700; letter-spacing: 0.4px; color: var(--white); white-space: nowrap; }
.tb-pill .pill-arr { font-size: 8px; color: #555; }
.tb-menu { display: none; position: absolute; top: 34px; right: 0; background: #1a1a1a; border: 1px solid #333; border-radius: 6px; min-width: 160px; z-index: 9999; box-shadow: 0 8px 24px rgba(0,0,0,0.6); overflow: hidden; }
.tb-menu.open { display: block; }
.tb-menu div { padding: 10px 16px; font-size: 11px; font-weight: 700; letter-spacing: 0.4px; color: #fff; cursor: pointer; white-space: nowrap; }
.tb-menu div:hover { background: #2a2a2a; }
.tb-menu div.sel { color: var(--sky); }
@media (max-width: 480px) { .topbar-brand .doc-name { display: none; } }

/* --- PAGE HEADER --- */
.page-header { background: var(--black); padding: 28px 24px 22px; border-bottom: 2px solid var(--sky); }
.page-header .breadcrumb { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #555; margin-bottom: 12px; }
.page-header .breadcrumb span { color: var(--sky); }
.loc-row { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; position: relative; margin-bottom: 6px; -webkit-tap-highlight-color: transparent; }
.loc-row .loc-title { font-family: 'Kessel Heavy', sans-serif; font-size: 34px; color: var(--sky); letter-spacing: 3px; line-height: 1; }
.loc-row .loc-arr { color: #555; font-size: 14px; }
.loc-row:hover .loc-arr { color: var(--sky); }
.loc-row .tb-menu { top: 40px; right: auto; left: 0; }
.date-row { display: flex; align-items: center; gap: 12px; }
.date-nav { width: 36px; height: 36px; background: transparent; border: 1px solid #2a2a2a; border-radius: 50%; color: var(--white); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all var(--transition); }
.date-nav:hover { border-color: var(--sky); color: var(--sky); }
.date-nav svg { width: 14px; height: 14px; }
.page-header h1 { font-family: 'Kessel Heavy', sans-serif; font-size: 34px; color: var(--white); letter-spacing: 3px; line-height: 1; flex: 1; }
.page-header h1 em { font-style: normal; color: var(--sky); }
.section-meta { display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.meta-pill { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #666; background: #111; border: 1px solid #2a2a2a; border-radius: 20px; padding: 4px 12px; cursor: default; }
.meta-pill.highlight { border-color: rgba(135,206,235,0.3); color: var(--sky); background: rgba(135,206,235,0.07); }
.meta-pill.done { border-color: rgba(46,204,113,0.3); color: #2ecc71; background: rgba(46,204,113,0.07); }
.meta-pill.btn { cursor: pointer; transition: all var(--transition); }
.meta-pill.btn:hover { border-color: var(--sky); color: var(--sky); }
@media (max-width: 480px) { .page-header h1, .loc-row .loc-title { font-size: 26px; letter-spacing: 2px; } .page-header { padding: 22px 16px 18px; } }

/* --- CONTENT --- */
.content { max-width: 820px; margin: 0 auto; padding: 8px 24px 80px; }
@media (max-width: 480px) { .content { padding: 4px 12px 80px; } }
.section-label { font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--gray-mid); margin: 26px 0 10px; display: flex; align-items: center; gap: 8px; }
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--gray-border); }
.section-label .count { color: #999; letter-spacing: 1px; }

/* --- TASK (accordion) --- */
.task { margin-bottom: 10px; border: 1px solid var(--gray-border); border-radius: 2px; background: var(--white); overflow: hidden; transition: opacity var(--transition); }
.task-row { display: flex; align-items: center; gap: 14px; padding: 16px 16px 16px 14px; width: 100%; text-align: left; border: none; background: none; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
.task-row:hover { background: var(--gray-light); }
@media (hover: none) { .task-row:hover { background: transparent; } }
.tick { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--black); background: var(--white); display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; transition: all var(--transition); }
.tick svg { width: 13px; height: 13px; color: var(--white); opacity: 0; transition: opacity var(--transition); }
.tick:hover { border-color: var(--sky); }
.task.done .tick { background: var(--success); border-color: var(--success); }
.task.done .tick svg { opacity: 1; }
.task.done { opacity: 0.55; }
.task.done .acc-title { text-decoration: line-through; }
.task-label { flex: 1; min-width: 0; }
.acc-title { font-family: 'Kessel Heavy', sans-serif; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--black); line-height: 1.4; }
.acc-desc { font-size: 11px; color: var(--gray-mid); margin-top: 3px; letter-spacing: 0.3px; line-height: 1.4; }
.badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
.badge { font-size: 8px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--gray-border); color: var(--gray-mid); }
.badge.weekly { border-color: rgba(245,158,11,0.5); color: #b45309; background: var(--warning-bg); }
.badge.fortnightly { border-color: rgba(22,160,133,0.5); color: #0f766e; background: #f0faf8; }
.badge.monthly { border-color: rgba(192,57,43,0.4); color: #b91c1c; background: #fdf0ef; }
.badge.pipeline { border-color: rgba(231,76,60,0.4); color: #c0392b; background: #fff5f5; }
.badge.offroster { border-color: rgba(135,206,235,0.6); color: #1a6b8a; background: var(--sky-light); }
.accordion-icon { width: 28px; height: 28px; border-radius: 50%; background: var(--black); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background var(--transition); }
.task-row:hover .accordion-icon, .task.open .accordion-icon { background: var(--sky); }
.accordion-icon svg { width: 12px; height: 12px; color: var(--white); transition: transform 0.3s ease; }
.task.open .accordion-icon svg { transform: rotate(90deg); }
.task.open .accordion-icon svg path { stroke: var(--black); }
.task-body { display: none; border-top: 1px solid var(--gray-border); }
.task.open .task-body { display: block; }
.task-body-inner { padding: 20px 18px 22px; }
.task-body-inner > p.intro { font-size: 13.5px; line-height: 1.7; color: #333; margin-bottom: 14px; }
.checklist { list-style: none; padding: 0; margin: 6px 0 0; }
.checklist li { display: flex; align-items: flex-start; gap: 10px; font-size: 13.5px; line-height: 1.6; margin-bottom: 9px; color: #333; }
.checklist li::before { content: ''; display: block; width: 14px; height: 14px; flex-shrink: 0; background: var(--sky); border-radius: 50%; margin-top: 4px; }
.checklist li.hd { margin-top: 14px; margin-bottom: 6px; }
.checklist li.hd::before { display: none; }
.checklist li.hd strong { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--black); }
.checklist li > span { flex: 1; min-width: 0; }
.checklist li strong { color: var(--black); }
.callout { padding: 14px 16px; border-radius: 2px; margin: 18px 0 0; font-size: 13px; line-height: 1.6; display: flex; gap: 12px; align-items: flex-start; }
.callout.info { background: var(--sky-light); border: 1px solid rgba(135,206,235,0.5); border-left: 4px solid var(--sky); }
.callout.warning { background: var(--warning-bg); border: 1px solid rgba(251,191,36,0.5); border-left: 4px solid var(--warning-acc); }
.callout > div { flex: 1; }
.callout strong.cl { font-weight: 700; display: block; margin-bottom: 4px; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; }
.copy-block { background: var(--gray-light); border: 1px solid rgba(135,206,235,0.3); border-left: 4px solid var(--sky); border-radius: 2px; padding: 16px 18px; margin: 18px 0 0; position: relative; font-size: 12.5px; line-height: 1.6; color: var(--black); }
.copy-block .copy-block-type { font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--sky); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; padding-right: 80px; }
.copy-block .copy-block-type::before { content: ''; display: block; width: 14px; height: 1px; background: var(--sky); flex-shrink: 0; }
.copy-block-content { white-space: pre-wrap; word-break: break-word; font-family: 'Montserrat', sans-serif; }
.copy-btn { position: absolute; top: 12px; right: 12px; background: var(--black); color: var(--white); border: none; border-radius: 2px; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 6px 12px; cursor: pointer; transition: all var(--transition); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.copy-btn:hover { background: var(--sky); color: var(--black); }
.copy-btn.copied { background: var(--success); color: var(--white); pointer-events: none; }
.copy-btn svg { width: 11px; height: 11px; }
.checklist a { color: #1a6b8a; font-weight: 600; text-decoration: underline; }
.empty { font-size: 12px; color: #999; padding: 8px 0 4px; letter-spacing: 0.3px; }

/* --- FOOTER / RESET --- */
.foot { margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--gray-border); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.foot .note { font-size: 11px; color: #999; line-height: 1.5; }
.reset-btn { background: var(--black); color: var(--white); border: none; border-radius: 2px; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 9px 14px; cursor: pointer; transition: all var(--transition); }
.reset-btn:hover { background: var(--sky); color: var(--black); }
</style>

 and ready","Service members ordering after classes","Maintain clean work area while serving","Engage warmly with members — SUPPS is a touchpoint for connection"],"why":"First impressions matter. Members arriving for early classes should walk into a space that feels premium, prepared, and cared for. A well-set studio reflects STRONG and TYG brand standards and sets the tone for the entire shift. Having SUPPS stocked and ready before the class rush means faster service, happier members, and more revenue captured in the post-class window."},"prep":{"title":"Daily Prep + Community Check","description":"Strategic preparation block to set up the day for success. This is when FOH gets ahead of the day's priorities, coordinates with trainers, shares the day's outlook, ensures no member falls through the cracks, and checks in across all community channels.","items":["<strong>DAILY PREP:</strong>","Open the Daily Schedule Report Template and have it ready to fill in as you work through the below","Review today's class schedule in Hapana","Identify all <strong>Intro Offer/first-timer</strong> clients booked today and note their class times","Check Hapana for any member milestones hitting today (100 classes, 200 classes, anniversaries)","Check today's date for member birthdays in Hapana and prepare STRONG birthday card if needed","Note any <strong>new injuries</strong> or member updates flagged by trainers and include them in the report","Open Recovr and check for <strong>HIGH-RISK members</strong> booked into today's classes","Check Operandio for any new posts, updates or announcements from management","Review yesterday's FOH EOSR and the trainer EOSRs for any follow-up actions needed today","Daily reminder to team chat: request profile photo uploads from members during classes","Daily reminder to team chat: complete assigned member check-ins","Once complete, share the Daily Schedule Report to studio team chat — tag relevant trainers and team members","<strong>COMMUNITY CHECK r member birthdays in Hapana and prepare STRONG birthday card if needed","Note any <strong>new injuries</strong> or member updates flagged by trainers and include them in the report","Open Recovr and check for <strong>HIGH-RISK members</strong> booked into today's classes","Check Operandio for any new posts, updates or announcements from management","Review yesterday's FOH EOSR and the trainer EOSRs for any follow-up actions needed today","Daily reminder to team chat: request profile photo uploads from members during classes","Daily reminder to team chat: complete assigned member check-ins","Once complete, share the Daily Schedule Report to studio team chat — tag relevant trainers and team members","<strong>COMMUNITY CHECK:</strong>","Open studio community chat and respond to any messages with positive, on-brand tone","Check and respond to studio email inbox","Scan management WhatsApp for any time-sensitive information","Check and respond to Instagram DMs and comments","Flag anything that needs to be communicated to trainers or requires action"],"why":"Saturday's Starter Class is one of the most important acquisition touchpoints of the week. Proper preparation ensures every first-timer gets the attention and support they need — and the team is set up to convert. Community check ensures nothing is missed before the day gets busy.","specialNote":"⚠️ Instagram DMs must be responded to within 48 hours — after this window the platform locks the conversation and you will no longer be able to reply.<br><br>⚠️ Response Standards: Community chat within 24 hours weekdays, urgent matters flagged immediately."},"prep_pn":{"title":"Daily Prep + Community Check","description":"Strategic preparation block to set up the day for success across both STRONG and TYG. This is when FOH gets ahead of the day's priorities, coordinates with trainers, shares the day's outlook, and ensures no member falls through the cracks.","items":["Open two <strong>Daily Schedule Report Templates</strong> iallers — get permission before photographing","Share the TYG Daily Schedule Report to studio team chat — tag relevant trainer — <strong>must be sent by 7:25</strong>","<strong>STRONG PILATES PREP (complete by 7:25):</strong>","Review today's STRONG class schedule in Hapana","Identify all <strong>Intro Offer/first-timer</strong> clients booked today and note their class times","Check Hapana for any member milestones hitting today (100 classes, 200 classes, anniversaries)","Check today's date for member birthdays in Hapana and prepare STRONG birthday card if needed","Note any <strong>new injuries</strong> or member updates flagged by trainers and include them in the report","Open Recovr and check for <strong>HIGH-RISK members</strong> booked into today's STRONG classes","Check Operandio for any new posts, updates or announcements from management","Review yesterday's FOH EOSR and the trainer EOSRs for any follow-up actions needed today","Daily reminder to team chat: request profile photo uploads from members during classes","Share the STRONG Daily Schedule Report to studio team chat — tag relevant trainers and team members"],"why":"Sunday has two brands running simultaneously from 7:30 — getting both reports out by 7:25 means trainers know exactly who's walking through the door before the first class begins. TYG prep is priority given the single Hybrid class window."},"dsr_pm":{"title":"Update Daily Schedule Report + Community Check","description":"Review and refresh the Daily Schedule Report at the start of the PM shift. The AM shift will have completed the initial report — the PM shift's role is to check for any new bookings across PM classes and tomorrow's AM classes, update accordingly and resend to keep the team current. If there was no AM shift, complete the full report for the remaining day and tomorrow morning.","items":["<strong>DAILY SCHEDULE REPORT:</strong>","Check for any new bookings added to today's PM classes in Hapana","Check for any new bookings added to tomorrow's AM classes in Hapana","Identify any new <strong>Intro Offer/first-timer</strong> clients not already flagged","Check for any new <strong>HIGH-RISK members</strong> booked in not already flagged","Update the Daily Schedule Report with any changes","Resend updated report to studio team chat — tag relevant trainers and team members","<strong>If no AM shift:</strong>","Complete the full Daily Schedule Report for remaining PM classes and tomorrow's AM classes","Share to studio team chat — tag relevant trainers and team members","<strong>COMMUNITY CHECK:</strong>","Open studio community chat and respond to any messages with positive, on-brand tone","Read through new messages since AM shift and respond to any inquiries","Check and respond to studio email inbox","Scan management WhatsApp for any time-sensitive information","Check and respond to Instagram DMs and comments","Flag anything that needs to be communicated to trainers or requires action"],"why":"Keeping the Daily Schedule Report current throughout the day ensures the whole team always has an accurate picture of who's coming in. Consistent reporting across both shifts builds the habit of visibility and communication that keeps operations tight and members well looked after.","specialNote":"⚠️ Instagram DMs must be responded to within 48 hours — after this window the platform locks the conversation and you will no longer be able to reply.<br><br>⚠️ Response Standards: Community chat within 24 hours weekdays, urgent matters flagged immediately."},"stories":{"title":"Content Capture + Instagram Stories","description":"Capture content from classes and edit and post daily Instagram Stories. Follow social media guidelines for all content and posting.","items":["<strong>Always ask members for their Instagram handle and add/follow them — this is critical for tagging</strong>","<strong>Tag members in stories wherever possible — being tagged makes members feel seen and dramatically increases reach</strong>"," ial media guidelines — post to @theyardgym_penrith","Edit STRONG stories with brand-appropriate styling as per STRONG social media guidelines — post to @strongpilates_penrith","Add music, text overlays and stickers as appropriate","Confirm permission before tagging members","Use location tags and relevant hashtags","<strong>CONTENT CAPTURE: (if you need/want more content to post)</strong>","Use the <strong>studio phone</strong>","Follow the daily social media calendar to guide what kind of content to capture (if applicable)","Focus on member energy, movement quality and class atmosphere","Get a variety of angles and shots for storytelling","Ensure proper lighting and framing"],"why":"Content is one of the most powerful acquisition tools for both STRONG and TYG. Authentic daily stories showcase the community, the experience, and the energy to everyone watching on the outside. Tagging members massively amplifies reach and makes members feel seen and celebrated — turning them into advocates who bring others in."},"stories_pn_sun":{"title":"Instagram Stories - STRONG & TYG (Sunday)","description":"Edit and post Instagram Stories for both STRONG and TYG from content captured earlier in the shift. Follow social media guidelines for all content and posting.","items":["<strong>Tag members in stories wherever possible — being tagged makes members feel seen and dramatically increases reach</strong>","<strong>POSTING — complete by 10:30am:</strong>","Review all captured footage and select best clips","TYG: Post a minimum of 3–4 stories — follow the content calendar where applicable. Any additional events or ad hoc posts must be added on top of the minimum, not in place of them","STRONG: Post a minimum of 3–4 stories — follow the content calendar where applicable. Any additional events or ad hoc posts must be added on top of the minimum, not in place of them","Story mix example: 2 session/class stories, 1 education content, 1 trial offer/promotion — follow content guide where applicable","Alternative content: testimonials, local partnerships, studio updates, member spotlights","Note any <strong>Intro Offer/first-timer</strong> clients for potential content","Edit TYG stories with brand-appropriate styling as per TYG social media guidelines — post to @theyardgym_penrith","Edit STRONG stories with brand-appropriate styling as per STRONG social media guidelines — post to @strongpilates_penrith","Add music, text overlays and stickers as appropriate","Confirm permission before tagging members","Use location tags and relevant hashtags","<strong>CONTENT CAPTURE: (if you need/want more content to post)</strong>","Use the <strong>studio phone</strong>","Follow the daily social media calendar to guide what kind of content to capture (if applicable)","Focus on member energy, movement quality and class atmosphere","Get a variety of angles and shots for storytelling","Ensure proper lighting and framing"],"why":"Content is one of the most powerful acquisition tools for both STRONG and TYG. Authentic daily stories showcase the community, the experience, and the energy to everyone watching on the outside. Tagging members massively amplifies reach and makes members feel seen and celebrated — turning them into advocates who bring others in."},"recovr":{"title":"Retention & Engagement — Recovr","description":"Sales is no longer part of the FOH shift. The time that freed up is for members: knowing them by name, knowing their goals, their lives and what gets in the way of training, and helping them stay consistent. Recovr is the tool; the job is engagement. Take your time with each person. Work through the steps below in order.","items":["<strong>1. START WITH THE DAILY BRIEFING EMAIL:</strong>","Open the Recovr Daily Briefing email at the start of the shift","<strong>Sort out this morning</strong> first: urgent replies and freeze requests","<strong>Keep an eye on</strong>: note who has moved into high or medium risk","<strong>Check in with</strong>: regulars nobody has contacted lately — a friendly message or a chat in studio","<strong>In class today</strong>: find these members at their class and have a conversation","<strong>Congratulate</strong>: members back after a break or back on track — welcome them back in person when they are in, or by message if not","<strong>2. KNOW THE MEMBER BEFORE YOU CONTACT THEM — EVERY TIME:</strong>","Log into Recovr with your <strong>personal login</strong>","Open their profile: attendance history, last visit, package or membership status","Are they cancelling, suspended, or just back from suspension?","<strong>Read the notes</strong> in Recovr and in Hapana GROW — there may already be a reason on file (injury, travel, work, family)","Decide whether a call is appropriate. If there is a clear reason on file, a message may be better. If in doubt, call","<strong>3. HIGH RISK — CALL THEM:</strong>","<strong>Every high-risk member gets a call attempt</strong> once you have reviewed their details. Three SMS attempts and no call is not acceptable","Call first. SMS only if they do not answer, and leave the door open for them to reply","The call is a check-in, not a sales call: how are they going in general, how is the training going, what do they like about it, what makes it hard to get to class, and <strong>how can we help them get in consistently</strong>","Listen for roadblocks we can actually fix: class times, childcare, trainer fit, confidence, injury, booking issues","Book their next class with them during the call if you can","<strong>4. MEDIUM RISK — SAME APPROACH:</strong>","Action 10–20 medium-risk members a day, most recent drop-off first","Review before you contact, then call or SMS — the same conversation as above","Snooze 2–4 weeks after contact, using judgement","<strong>5. INBOX:</strong>","Reply to every member waiting. Acknowledge what they said, help solve it, book their next class where you can","<strong>6. NEXT UP:</strong>","Work through Next Up every shift. It refills as you action people, so it is ongoing — not a list to clear","<strong>Skip sales cards</strong> (Intro ending, Renewal closing, Convert) and leave them in the queue for the sales consultant","Everything else is yours: first slips, coming less, welcome backs, on a roll, regulars with no personal contact on record","<strong>7. EVERY MESSAGE:</strong>","<strong>Start every new message with your name and STRONG</strong>, e.g. \"Hi Sarah, it's Jess from STRONG\" — <strong>every time</strong>. The only exception is when you are already mid-conversation in a thread","Review and personalise any AI-generated message before sending so it sounds like you","<strong>8. ON-SITE CONVERSATIONS COUNT:</strong>","If you speak to a high- or medium-risk member in the studio, that is the contact. Update their notes and snooze in Recovr. No message needed","Use the quiet parts of the shift to talk to members: names, goals, why they train, work, family, pets, upcoming events (weddings, birthdays, graduations)","<strong>9. NOTES AFTER EVERY CONTACT:</strong>","Record what you sent or discussed, their response, sentiment, personal details learned and next steps — in Recovr and/or GROW. If unsure which, check both","Flag anyone who needs management attention"],"why":"Keeping members matters as much as finding new ones, and most people leave quietly because nobody noticed and nobody asked. A real conversation with someone who knows their name and their situation is the thing that changes that. Recovr tells us who; the call and the chat in studio are where it happens.","specialNote":"<strong>Not sales.</strong> Intro Offer conversions, pack renewals and membership upgrades belong to the sales consultant. If a member raises them, pass it on and note it. Your job is to help them train consistently."},"recovr_pn":{"title":"Retention & Engagement — Recovr (STRONG & TYG)","description":"Sales is no longer part of the FOH shift. The time that freed up is for members: knowing them by name, knowing ng or late evening classes.","items":["Quick walk through all studio spaces","Wipe down reception desk/counter","Tidy any loose items, magazines, water bottles","Reset waiting area furniture","Return dumbbells and all equipment to their place","Quick bathroom check — wipe counters, ensure supplies stocked","Straighten retail display if applicable","Empty small bins if needed","Ensure studio looks pristine and ready for tomorrow"],"why":"Maintaining premium presentation throughout the day reinforces brand standards. Quick tidying prevents small messes from accumulating. Last shift of day ensures studio is left in excellent condition."},"tidy_supps_ch":{"title":"SUPPS Closing + Studio Tidying","description":"Close out the SUPPS station and do a final tidy of the studio before the end of the shift, leaving everything clean and ready for the next day.","items":["<strong>SUPPS CLOSING:</strong>","Clean and sanitise all prep areas","Wash all blenders completely","Take out rubbish, replace bin liners","Drain dishwasher","Wipe out fridge thoroughly","Ensure all food items are covered and dated","Complete stocktake and record items to order","Reconcile cash float","Tidy entire workstation","Pack away A-frame signage","Lock SUPPS area if applicable","<strong>STUDIO TIDYING:</strong>","Quick walk through all studio spaces","Wipe down reception desk/counter","Tidy any loose items, water bottles","Reset waiting area furniture","Return dumbbells and all equipment to their place","Quick bathroom check — wipe counters, ensure supplies stocked","Empty small bins if needed","Ensure studio looks pristine and ready for tomorrow"],"why":"How the studio is left at the end of the day sets the tone for the next morning. A thorough close means the AM shift walks into a clean, stocked and ready studio — and SUPPS can open smoothly without having to fix the night before's mess."},"tidy_supps_pn":{"title":"Studio Tidying + SUPPS Closing","description":"Combined end-of-shift reset — close out the studio and SUPPS station properly to maintain hygiene standards and ensure a smooth opening tomorrow.","items":["Quick walk through all studio spaces","Wipe down reception desk/counter","Tidy any loose items, magazines, water bottles","Reset waiting area furniture","Return dumbbells and all equipment to their place","Quick bathroom check — wipe counters, ensure supplies stocked","Straighten retail display if applicable","Empty small bins if needed","Ensure studio looks pristine and ready","Clean and sanitise all SUPPS prep areas","Clean coffee station — flush group heads, soak portafilters","Wash all blenders completely","Take out rubbish and coffee grind, replace bin liners","Drain dishwasher","Wipe out fridge thoroughly","Ensure all food items are covered and dated","Complete stocktake and record items to order","Reconcile cash float","Tidy entire workstation","Pack away A-frame signage","Lock SUPPS area if applicable"],"why":"The end of shift is as important as the start. A thorough close of both the studio and SUPPS ensures the space is left in premium condition and tomorrow opens smoothly — hygiene standards are non-negotiable in food service, and a completed stocktake means the next shift has everything they need from the moment they open."},"supps_maint_pn":{"title":"SUPPS Maintenance (Shift 1 handover)","description":"Reset the SUPPS station before Shift 2 takes over.","items":["<strong>SUPPS MAINTENANCE:</strong>","Empty bins at SUPPS station","Top up stock — cups, lids, straws, napkins and ingredients as needed","Ensure blenders are clean and ready","Wipe down all surfaces and ensure workstation is tidy","Check fridge and freezer stock levels"],"why":"How Shift 1 ends is how Shift 2 begins. A tidy, stocked SUPPS means Shift 2 walks in ready to serve."},"eosr":{"title":"FOH EOSR","description":"The EOSR is your end-of-shift report — sent as a single WhatsApp message to the FOH team chat. It creates continuity, accountability and visibility across the whole team. Done well, it takes 5-10 minutes. The best way to do this is to fill it out as you go through your shift — it follows the same order as your daily tasks, so there's no scrambling at the end. Be specific with names, numbers and outcomes. Don't write \"yes\" or \"done\" — write what actually happened. If you missed something, note it and action it — the EOSR is how you catch things before they fall through the cracks.","items":["<strong>Fill this out as you go through your shift</strong> — it acts as a checklist as you work, and should take no longer than 5-10 minutes to finalise if done that way","Copy the EOSR template below into your notes at the start of the shift and fill it in as you go","Complete all sections — do not skip any, even if just to note \"N/A — reason\"","Be specific: use names, numbers and outcomes — not \"yes\", \"done\" or \"completed\"","If you missed something during your shift — note it, flag it, and action it before sending","Review what you've written before sending — ask yourself: would the next shift know exactly where things are at?","Send as ONE message to FOH team chat (send right at end of shift)"],"why":"The FOH EOSR is the last and one of the most important tasks of the shift. A detailed, honest report creates operational continuity and accountability — it prevents things from falling through the cracks, gives the whole team visibility into daily operations, and ensures the next shift starts fully informed with nothing lost in the handover. It also gives you visibility on areas you may have missed, highlights where you're consistently doing well, and keeps focus on what matters most.","template":"FOH END OF SHIFT REPORT – [DATE] – [STUDIO]\nShift: AM / PM\nFOH Staff:\n\n1. STUDIO SETUP & PRESENTATION\n(Reception, studio and bathrooms clean, tidy and member-ready. Temperature, music and amenities checked.)\nComplete? Yes / No\nNotes:\n\n2. DAILY PREP & MEMBER EXPERIENCE\n(Daily Schedule Report sent: first-timers, Intro Offers, high-risk, milestones, birthdays, new injuries. Trainer EOSRs reviewed.)\nComplete? Yes / No\nNotes:\n\n3. COMMUNITY & ADMIN\n(Community chats, Instagram DMs, Operandio, management WhatsApp, studio email.)\nComplete? Yes / No\nNotes:\n\n4. RECOVR – RETENTION & ENGAGEMENT\nDaily Briefing actioned? Yes / No\nHigh risk called (names / outcomes):\nMedium risk contacted:\nInbox cleared? Yes / No\nNext Up worked? Yes / No\nMembers needing management attention:\nWho did you get to know today (goals, life, roadblocks)?\nNotes:\n\n5. SOCIAL MEDIA\n(Stories posted, members tagged, DMs and comments actioned.)\nStories posted: __ / 4\nNotes:\n\n6. CAMPAIGNS & EVENTS\n(Campaigns & Events doc checked, tasks due actioned, studio column ticked.)\nComplete? Yes / No\nNotes:\n\n7. GRASSROOTS & LOCAL AREA MARKETING\n(Reached out / followed up / updated the document — which, and who?)\nAction taken:\nNotes:\n\n8. STUDIO RESET\n(Reception, bathrooms, dumbbells and equipment reset, supplies restocked.)\nComplete? Yes / No\nMaintenance / supply issues to report:\n\n9. WEEKLY TASK\nTask:\nCompleted? Yes / No / N/A\nNotes:\n\n10. HANDOVER & OUTSTANDING ACTIONS\nNotes:"},"starter":{"title":"Run the Saturday Starter Class","description":"One of the most important classes of the week for acquisition. Be there before, during and after. The goal: every beginner leaves booked into their next session or on the Intro Offer.","items":["<strong>BEFORE CLASS — GREET:</strong>","Greet each beginner warmly as they arrive","Do FULL site tour for everyone — can be done as a group if multiple beginners","Briefly explain what to expect in the Starter Class — the trainer will show them how the reformer works","Ask if they've trained before and what their goals are (light discovery)","<strong>Introduce them to the trainer</strong> — can be done as a group introduction if multiple beginners","<strong>Let them know you'll check in on them mid-class</strong>","<strong>Ask them to come to the front desk after class to chat about how it went</strong> — this is when you'll discuss their Intro Offer or booking their next session","Make them feel welcome and comfortable — first impressions matter","Get their contact info if not already in system","<strong>MID-CLASS — CHECK:</strong>","Around mid-class, quickly walk through the reformer room","Check in with ALL beginners briefly (just a quick \"how are you doing?\")","If anyone looks confused or struggling, let the trainer know","Don't disrupt the class — this is a very brief touchpoint","Note anyone who might need extra support post-class","<strong>AFTER CLASS — CONVERT:</strong>","Be present immediately after the Starter Class finishes — catch them while energy is high","Check in with each beginner: \"How was your first class? What did you think?\"","Chat briefly and ask if they want to do more classes to see if it's for them","<strong>Recommend and sell the 5 for $50 Intro Offer then and there — guide them through purchasing via the STRONG app (preferred) or put through CORE</strong>","<strong>If already on Intro Offer — get them booked in for their next session</strong>","If they're already ready to commit, discuss membership options","Get their goals — ask what their main reason for wanting to start is","Note goals down to add to Hapana notes","Answer questions, address concerns, remove barriers to signing up","Book their next class immediately if possible","If not ready to commit, get contact info and hand to the sales consultant for a Monday follow-up"],"why":"This is the moment everything has been building toward. Beginners are feeling accomplished and energised — this is when the conversation about continuing their STRONG journey is most natural and most likely to succeed. Every conversion here directly impacts studio revenue and community growth."},"starter_lep":{"title":"Run the Saturday Starter Class","description":"One of the most important classes of the week for acquisition. Be there before, during and after. The goal: every beginner leaves booked into their next session or on the Intro Offer.","items":["<strong>BEFORE CLASS — GREET:</strong>","Greet each beginner warmly as they arrive","Do FULL site tour for everyone — can be done as a group if multiple beginners","Briefly explain what to expect in the Starter Class — the trainer will show them how the reformer works","Ask if they've trained before and what their goals are (light discovery)","<strong>Introduce them to the trainer</strong> — can be done as a group introduction if multiple beginners","<strong>Let them know you'll check in on them mid-class</strong>","<strong>Ask them to come to the front desk after class to chat about how it went</strong> — this is when you'll discuss their Intro Offer or booking their next session","Make them feel welcome and comfortable — first impressions matter","Get their contact info if not already in system","<strong>MID-CLASS — CHECK:</strong>","Around mid-class, quickly walk through the reformer room","Check in with ALL beginners briefly (just a quick \"how are you doing?\")","If anyone looks confused or struggling, let the trainer know","Don't disrupt the class — this is a very brief touchpoint","Note anyone who might need extra support post-class","<strong>AFTER CLASS — CONVERT:</strong>","Be present immediately after the Starter Class finishes — catch them while energy is high","Check in with each beginner: \"How was your first class? What did you think?\"","Chat briefly and ask if they want to do more classes to see if it's for them","<strong>Recommend and sell the 5 for $50 Intro Offer then and there — guide them through purchasing via the STRONG app (preferred) or put through CORE</strong>","<strong>If already on Intro Offer — get them booked in for their next session</strong>","If they're already ready to commit, discuss membership options","Get their goals — ask what their main reason for wanting to start is","Note goals down to add to Hapana notes","Answer questions, address concerns, remove barriers to signing up","Book their next class immediately if possible","If not ready to commit, get contact info and add to pipeline for Monday follow-up call"],"why":"This is the moment everything has been building toward. Beginners are feeling accomplished and energised — this is when the conversation about continuing their STRONG journey is most natural and most likely to succeed. Every conversion here directly impacts studio revenue and community growth."},"tyg_sat":{"title":"Run the Saturday TYG First-Timer Session","description":"Cover the 6:15am and 7:00am (Payday/Gameday) TYG sessions: lemon water ready, first-timers greeted and toured, checked on mid-class, and spoken to straight after. This is the start of their TYG journey.","items":["<strong>LEMON WATER:</strong>","Check dispenser is clean, water has the right amount of lemon, and is filled with plenty of ice — it must look fresh and pristine","Have dispensers ready and positioned for the end of the 6am session and at the start of the 7am session (Payday/Gameday)","Restock and refresh dispensers as needed throughout the shift","<strong>BEFORE CLASS — GREET:</strong>","<strong>ENGAGE WITH ANY FIRST-TIMERS/TRIALLERS IN THE 6:15AM SESSION — FOLLOW PROCESS TO BOOK NEXT SESSION OR CONVERSION</strong>","Greet each first-timer warmly as they arrive","Do a FULL site tour — walk them through the gym and explain the dual-zone setup: the RIG area and the TURF area, what each is used for and what to expect in class — can be done as a group if multiple first-timers","Ask if they've trained before and what their goals are (light discovery)","<strong>Introduce them to the trainer</strong> — can be done as a group introduction if multiple first-timers","<strong>Let them know you'll check in on them mid-class</strong>","<strong>Ask them to come to the front desk after class to chat about how it went</strong>","Make them feel welcome and comfortable — first impressions matter","Get their contact info if not already in system","If no first-timers: catch up with regular members, build community and connection, note any feedback or concerns","<strong>MID-CLASS — CHECK-IN:</strong>","Around mid-class, quickly check in with ALL TYG first-timers and triallers — just a quick \"how are you doing?\"","If anyone looks confused or struggling, let the trainer know","Don't disrupt the class — this is a very brief touchpoint","Note anyone who might need extra support post-class","<strong>AFTER CLASS — CONVERT / CATCH-UP:</strong>","<strong>Every conversation must end with one of three outcomes:</strong>","<strong>1. Booked into their next session</strong>","<strong>2. Converted to a membership</strong>","<strong>3. Handed to the sales consultant for follow-up</strong>","Be present immediately as the TYG class ends — catch them while energy is high","Check in with each first-timer: \"How was your first class? What did you think?\"","Chat briefly and ask if they want to do more classes to see if it's for them","Get their goals — ask what their main reason for wanting to start is","Note goals down to add to Mindbody notes","Answer questions, address concerns, remove barriers to signing up","Regular members: general catch-up and connection — ask how they're going, note any feedback or concerns"],"why":"This is the moment everything has been building toward. First-timers and triallers are feeling accomplished and energised — this is when the conversation about continuing their TYG journey is most natural and most likely to succeed. Every conversion here directly impacts studio revenue and community growth."},"welcome_pn_sun":{"title":"Welcome Next Class / Member Catch-up","description":"Between Sunday classes: greet arriving members, welcome any first-timers, catch up with regulars.","items":["Greet warmly and introduce yourself","Provide full studio tour before their first class","Explain what to expect in class and how equipment works","Introduce them to their trainer personally","Check in briefly during class if possible","Be present after class to answer questions","Get their feedback and goals","Book their next class before they leave","Follow up with SMS or call within 24 hours"],"why":"First impressions determine whether someone becomes a long-term member. A great first experience dramatically increases conversion rates."},"stock":{"title":"Stock Check","description":"Review studio supplies inventory and create order list. Completed weekly, typically on Monday.","items":["Review studio supplies inventory: toilet paper, paper towels, hand soap, cleaning supplies, cups, napkins, etc.","Check retail inventory if applicable","Note what's running low or out of stock","Create supply order list","Submit to management for approval OR purchase directly if within approval limits and have expense card","Ensure studio won't run out of critical supplies before next stock check"],"why":"Running out of basic supplies is avoidable and reflects poorly on the studio. A weekly stock check ensures the team is never caught short and members always experience a well-stocked, well-run studio."},"birthday":{"title":"Birthday Report","description":"Pull the week's upcoming birthdays, prepare cards and ensure every member feels celebrated on their special day. Completed weekly, typically on Monday. Note: birthday card and outreach process is currently in trial phase.","items":["Log into Hapana GROW — Contacts tab — open the Birthdays Smart List (instructions to be provided)","Note all members with birthdays for the upcoming week","Prepare a birthday card for each member and leave on the front desk","Notify team of upcoming birthdays via the Daily Schedule Report","Each day, check if members with birthdays are booked in and flag in Daily Schedule Report","Trainers to check their class lists for birthday members and hand card if FOH not available","If member doesn't attend on their birthday — hold card at front desk until they come in","Send birthday message via SMS to members who haven't attended on their birthday (automation to be set up)","Every Monday — remove any unclaimed cards from previous week and start fresh for upcoming week"],"why":"Birthdays are one of the simplest and most powerful ways to make a member feel seen and valued. A card on the desk and a message from the team shows we know who they are beyond just a booking — and that kind of genuine care is what builds long-term loyalty."},"vacuum":{"title":"Studio Vacuum","description":"Quick weekly vacuum of studio floors to maintain cleanliness and premium presentation.","items":["Quick vacuum of all studio floor areas","Focus on high-traffic zones and visible areas","Vacuum reception/waiting area","Check for dusty surfaces and dust/vacuum as needed","Empty vacuum cleaner when finished","Return vacuum to storage"],"why":"A clean studio is a non-negotiable. Weekly vacuuming keeps the space looking and feeling premium — members notice, and it reflects a team that takes pride in their environment.","dayIndex":2},"brag":{"title":"Update Brag Wall","description":"Refresh the Brag Wall with recent milestones, testimonials, and member achievements. Completed weekly, typically on Thursday.","items":["<strong>Ensure the Brag Wall is in the right location — visible, accessible and prominent. It must be the community centrepiece that members see every day, not tucked away as an afterthought</strong>","<strong>Ensure it is well-organised, visually appealing and immediately engaging — this is one of the most important community building tools in the studio</strong>","Review milestones captured during the week","Gather any milestone photos that haven't been added to Brag Wall yet","Print photos if needed (or get polaroids printed)","Check for any testimonials from milestone members","Review recent social media posts for good content to add","Add fresh content and remove anything outdated","Brag Wall should showcase: milestone celebrations, testimonials, social media highlights, member achievements","Step back and assess — does it look engaging? Does it represent the current studio community?"],"why":"The Brag Wall is the community centrepiece of the studio — a badge of honour that members and the team can be genuinely proud of. Keeping it fresh, current and celebratory shows that achievements are recognised and valued. It creates an instant point of commonality, inspires members to push toward their own milestones, and is a physical representation of everything the STRONG community stands for. A neglected Brag Wall sends a message — a thriving one celebrates the people who show up every day and make this community what it is."},"hq":{"title":"HQ Weekly Update Review","description":"Check the Friday email from STRONG head office and share what matters with the team. Do this on the day the email lands, even if you are not rostered on.","items":["Open the HQ Weekly Update email from STRONG head office","Read thoroughly — don't skim","Identify information relevant to your studio: marketing campaigns, policy changes, new formats, pricing updates, promotional offers, operational changes, company news","Create summary of key points that affect studio operations","Share relevant information to studio team chat — tag relevant trainers and team members","Flag anything that requires action or decision","Keep copy of HQ Weekly Update for reference during the week"],"why":"The HQ Weekly Update keeps the whole studio aligned with what's happening across the STRONG network. Missing or ignoring it means the team operates without critical context — campaigns get missed, policy changes go unactioned, and opportunities are lost.","specialNote":"Task to be completed on the specified day even if not rostered on, and falls under the outside of studio hours."},"mondayprep_ch":{"title":"Monday Prep + Weekly Prep","description":"Use the end of the Sunday shift to set the studio and the team up for a strong start to the week. This is about getting ahead — not scrambling on Monday morning.","items":["<strong>MONDAY PREP:</strong>","Review Monday's full class schedule in Hapana","Identify all <strong>Intro Offer/first-timer</strong> clients booked for Monday","Check for any <strong>HIGH-RISK members</strong> booked into Monday classes","Check for any member milestones or birthdays on Monday","Prepare Daily Schedule Report Template ready to send Monday morning","<strong>WEEKLY PREP:</strong>","Review the full week ahead in Hapana — note any key dates, events or busy periods","Check for any upcoming milestones or birthdays across the week","Flag anything that needs management attention before the week begins","Ensure EOSR is complete and submitted before leaving"],"why":"Sunday prep is what makes Monday morning seamless. Walking in on Monday knowing exactly who's coming in, what needs actioning and what the week looks like means the team hits the ground running — not catching up."},"mondayprep_pn":{"title":"Admin & Monday Prep","description":"Use this block to handle admin, check emails, and set the studio and team up for a strong start to the week across both STRONG and TYG. This is about getting ahead — not scrambling on Monday morning.","items":["<strong>ADMIN:</strong>","Check and respond to STRONG Pilates emails","Check and respond to The Yard Gym emails","Follow up on any urgent Recovr responses from earlier session","Complete any other administrative tasks (invoicing, ordering, etc.)","Quick scan of Operandio for updates","<strong>MONDAY PREP:</strong>","Open two <strong>Daily Schedule Report Templates</strong> and have both ready to fill in as you work through the below","<strong>STRONG:</strong>","Review Monday's full STRONG class schedule in Hapana","Identify all <strong>Intro Offer/first-timer</strong> clients booked for Monday","Check for any <strong>HIGH-RISK members</strong> booked into Monday STRONG classes","Check for any member milestones or birthdays on Monday","Prepare Daily Schedule Report Template ready to send Monday morning","<strong>TYG:</strong>","Review Monday's full TYG class schedule in Mindbody","Identify all <strong>trial/first-timer</strong> bookings for Monday TYG classes","Check for any <strong>HIGH-RISK members</strong> booked into Monday TYG classes","Check for any member birthdays on Monday","Prepare Daily Schedule Report Template ready to send Monday morning","<strong>SEND TO TRAINERS:</strong>","Send WhatsApp to trainers listing all Monday first-timers across both STRONG and TYG","<strong>WEEKLY PREP:</strong>","Review the full week ahead across both brands — note any key dates, events or busy periods","Check for any upcoming milestones or birthdays across the week","Flag anything that needs management attention before the week begins","Ensure EOSR is complete and submitted before leaving"],"why":"Sunday prep is what makes Monday morning seamless. Walking in on Monday knowing exactly who's coming in, what needs actioning and what the week looks like means the team hits the ground running — not catching up."},"pipeline":{"title":"Pipeline Management Block","description":"This is one of the most critical blocks of the shift — if not the most important. Everything starts from here. Pipeline Management isn't about clearing a list, it's about making genuine attempts to connect with potential long-term members of the STRONG community. Every call matters. The goal is to maintain good pipeline hygiene — following the cadence, leaving detailed notes, and progressing clients through each stage with an obvious focus on conversion. Utilise this time block effectively.","items":["<strong>INTRO OFFER PIPELINE (Hapana GROW):</strong>","<strong>EXPIRED:</strong> Work expired Intro Offer clients first — these are highest priority, last chance to convert","<strong>PURCHASE:</strong> Contact all clients in Purchase stage — complete Welcome Call and get their first session booked","<strong>NON-ATTENDANCE:</strong> Call all non-attendance clients — find out why they haven't attended and get them booked","<strong>1ST CLASS ATTENDED:</strong> Call all 1st Class Attended clients where time permits","<strong>ACTIVE:</strong> Identify any active clients at Day 12 OR who have completed their 3rd session — complete conversion outreach","<strong>ENSURE NEXT CLASS BOOKED:</strong>","Use Recovr — Conversions Tab to identify all active Intro Offer clients with no next session booked","Call each client to check in and get them booked into their next session — every active client should have a class booked at all times","<strong>LEADS PIPELINES:</strong>","Work through Leads and Leads - Other Promotions pipelines","Drive Intro Offer uptake and Starter Class bookings","<strong>ALL CONTACTS:</strong>","SMS/email where call unanswered — use approved templates, personalise where possible","Log all interactions and update pipeline stages as per sales process","Flag any clients needing management attention","Note any wins or conversions for EOSR"],"why":"Every person in the pipeline is a potential long-term member of the STRONG community. Consistent, genuine outreach is what turns enquiries into triallers and triallers into members. Good pipeline hygiene also ensures the whole team has visibility on where every prospect is at, making handover seamless and nothing gets lost."},"pipeline_pm":{"title":"Pipeline Management Block","description":"This is one of the most critical blocks of the shift — if not the most important. Everything starts from here. Pipeline Management isn't about clearing a list, it's about making genuine attempts to connect with potential long-term members of the STRONG community. Every call matters. The goal is to maintain good pipeline hygiene — following the cadence, leaving detailed notes, and progressing clients through each stage with an obvious focus on conversion. Utilise this time block effectively.","items":["<strong>INTRO OFFER PIPELINE (Hapana GROW):</strong>","<strong>EXPIRED:</strong> Work expired Intro Offer clients first — these are highest priority, last chance to convert","<strong>PURCHASE:</strong> Contact all clients in Purchase stage — complete Welcome Call and get their first session booked","<strong>NON-ATTENDANCE:</strong> Call all non-attendance clients — find out why they haven't attended and get them booked","<strong>1ST CLASS ATTENDED:</strong> Call all 1st Class Attended clients where time permits","<strong>ACTIVE:</strong> Identify any active clients at Day 12 OR who have completed their 3rd session — complete conversion outreach","<strong>ENSURE NEXT CLASS BOOKED:</strong>","Use Recovr — Conversions Tab to identify all active Intro Offer clients with no next session booked","Call each client to check in and get them booked into their next session — every active client should have a class booked at all times","<strong>LEADS PIPELINES:</strong>","Work through Leads and Leads - Other Promotions pipelines","Drive Intro Offer uptake and Starter Class bookings","<strong>ALL CONTACTS:</strong>","SMS/email where call unanswered — use approved templates, personalise where possible","Log all interactions and update pipeline stages as per sales process","Flag any clients needing management attention","Note any wins or conversions for EOSR"],"why":"Every person in the pipeline is a potential long-term member of the STRONG community. Consistent, genuine outreach is what turns enquiries into triallers and triallers into members. Good pipeline hygiene also ensures the whole team has visibility on where every prospect is at, making handover seamless and nothing gets lost."},"firsttimer":{"title":"First-Timer Experience","description":"Ensure every first-time visitor has an exceptional experience that encourages them to return.","items":["Greet warmly and introduce yourself","Provide full studio tour before their first class","Explain what to expect in class and how equipment works","Introduce them to their trainer personally","Check in briefly during class if possible","Be present after class to answer questions","Get their feedback and goals","Book their next class before they leave","Follow up with SMS or call within 24 hours"],"why":"First impressions determine whether someone becomes a long-term member. A great first experience dramatically increases conversion rates."},"systemdata":{"title":"System Data & Notes","description":"Notes live in two places: Hapana GROW and Recovr. Leave a note in whichever you are working in, and if you are unsure whether something has already been captured, check both.","items":["<strong>Leave notes in GROW and/or Recovr after every member interaction. If unsure, check both so nothing is missed</strong>","Add notes after every member interaction","Record goals, preferences, injuries, concerns","Note conversation highlights and personal details","Update contact preferences (call vs SMS)","Track milestone achievements","Document feedback (positive and negative)","Record class preferences and favorite trainers","Note any special circumstances or accommodations needed"],"why":"Detailed notes enable personalized service that makes members feel valued and understood. Good data = better retention."},"testimonials":{"title":"Testimonial Collection (monthly)","description":"Once a month, collect and post member testimonials. Aim for at least two per studio.","items":["Think back over the month: who had a win, hit a milestone, came back from a break, or told you something good about their training?","Ask them in person or by text: \"Would you mind sharing what you love about STRONG?\"","Collect responses via SMS or a short voice note if they prefer","Get permission to use it publicly and note whether they want their name used","Save testimonials in the shared document","Post at least one to Instagram Stories this month, tagged with permission","Add the best to the Brag Wall and share with management for marketing use"],"why":"Testimonials are powerful social proof that drive new member acquisition and validate current members' decision to stay."},"stock_pn":{"title":"Stock Check","description":"Review studio supplies inventory and create order list. Completed weekly, typically on Monday.","items":["Review studio supplies inventory: toilet paper, paper towels, hand soap, cleaning supplies, cups, napkins, etc.","Check retail inventory if applicable","Note what's running low or out of stock","Create supply order list","Submit to management for approval OR purchase directly if within approval limits and have expense card","Ensure studio won't run out of critical supplies before next stock check"],"why":"Running out of basic supplies is avoidable and reflects poorly on the studio. A weekly stock check ensures the team is never caught short and members always experience a well-stocked, well-run studio."},"recovr_lep":{"title":"Retention & Engagement — Recovr","description":"Sales is no longer part of the FOH shift. The time that freed up is for members: knowing them by name, knowing their goals, their lives and what gets in the way of training, and helping them stay consistent. Recovr is the tool; the job is engagement. Take your time with each person. Work through the steps below in order.","items":["<strong>1. START WITH THE DAILY BRIEFING EMAIL:</strong>","Open the Recovr Daily Briefing email at the start of the shift","<strong>Sort out this morning</strong> first: urgent replies and freeze requests","<strong>Keep an eye on</strong>: note who has moved into high or medium risk","<strong>Check in with</strong>: regulars nobody has contacted lately — a friendly message or a chat in studio","<strong>In class today</strong>: find these members at their class and have a conversation","<strong>Congratulate</strong>: members back after a break or back on track — welcome them back in person when they are in, or by message if not","<strong>2. KNOW THE MEMBER BEFORE YOU CONTACT THEM — EVERY TIME:</strong>","Log into Recovr with your <strong>personal login</strong>","Open their profile: attendance history, last visit, package or membership status","Are they cancelling, suspended, or just back from suspension?","<strong>Read the notes</strong> in Recovr and in Hapana GROW — there may already be a reason on file (injury, travel, work, family)","Decide whether a call is appropriate. If there is a clear reason on file, a message may be better. If in doubt, call","<strong>3. HIGH RISK — CALL THEM:</strong>","<strong>Every high-risk member gets a call attempt</strong> once you have reviewed their details. Three SMS attempts and no call is not acceptable","Call first. SMS only if they do not answer, and leave the door open for them to reply","The call is a check-in, not a sales call: how are they going in general, how is the training going, what do they like about it, what makes it hard to get to class, and <strong>how can we help them get in consistently</strong>","Listen for roadblocks we can actually fix: class times, childcare, trainer fit, confidence, injury, booking issues","Book their next class with them during the call if you can","<strong>4. MEDIUM RISK — SAME APPROACH:</strong>","Action 10–20 medium-risk members a day, most recent drop-off first","Review before you contact, then call or SMS — the same conversation as above","Snooze 2–4 weeks after contact, using judgement","<strong>5. INBOX:</strong>","Reply to every member waiting. Acknowledge what they said, help solve it, book their next class where you can","<strong>6. NEXT UP:</strong>","Work through Next Up every shift. It refills as you action people, so it is ongoing — not a list to clear","Leppington works all Next Up cards, including Intro ending, Renewal closing and Convert, alongside the pipeline","Everything else is yours: first slips, coming less, welcome backs, on a roll, regulars with no personal contact on record","<strong>7. EVERY MESSAGE:</strong>","<strong>Start every new message with your name and STRONG</strong>, e.g. \"Hi Sarah, it's Jess from STRONG\" — <strong>every time</strong>. The only exception is when you are already mid-conversation in a thread","Review and personalise any AI-generated message before sending so it sounds like you","<strong>8. ON-SITE CONVERSATIONS COUNT:</strong>","If you speak to a high- or medium-risk member in the studio, that is the contact. Update their notes and snooze in Recovr. No message needed","Use the quiet parts of the shift to talk to members: names, goals, why they train, work, family, pets, upcoming events (weddings, birthdays, graduations)","<strong>9. NOTES AFTER EVERY CONTACT:</strong>","Record what you sent or discussed, their response, sentiment, personal details learned and next steps — in Recovr and/or GROW. If unsure which, check both","Flag anyone who needs management attention"],"why":"Keeping members matters as much as finding new ones, and most people leave quietly because nobody noticed and nobody asked. A real conversation with someone who knows their name and their situation is the thing that changes that. Recovr tells us who; the call and the chat in studio are where it happens."},"campaigns":{"title":"Campaigns & Events Check","description":"The Master Campaigns & Events Document is where every campaign, event and promotion lives, with the tasks assigned to FOH and their due dates. Check it every shift so nothing is rushed or missed.","items":["Open the <a href=\"https://docs.google.com/spreadsheets/d/1VH72e_XutgLSJd3nweT1nBYZSX1-DHYGPRWRjpPVLog/edit\" target=\"_blank\" rel=\"noopener\">Master Campaigns & Events Document</a> and go to the current month tab","Read the campaign details and communications notes for anything running now or coming up","In each task table, find the rows assigned to <strong>FOH</strong> and check the due dates","<strong>Due today:</strong> complete it and tick your studio's column","<strong>Due this week:</strong> plan when it will be done and what you need — printing, cutting, decorating, contacting local businesses, posting","<strong>Posting:</strong> any campaign stories or grid posts for today go on top of the minimum 4 daily stories, not in place of them","<strong>Handover:</strong> anything you started but did not finish goes in your EOSR with where it is up to","If a task is unclear, not possible, or the assets are missing, flag it in the management chat rather than skipping it","Check the completion columns for other studios — if they are ahead of you, find out why"],"why":"Campaigns only work when every studio does its part on time. A poster that goes up a week late or a card that never gets printed means the whole network's effort lands unevenly. This check is how FOH stays ahead of it."},"grassroots":{"title":"Grassroots & Local Area Marketing","description":"The Grassroots document is a live, shared record of each studio's local outreach: who we have contacted, where conversations are up to and what opportunities are developing. Every shift, do at least one of three things: reach out, follow up, or update the document.","items":["<strong>EVERY SHIFT — ONE OF:</strong>","<strong>Reach out</strong> to a new local business, community group, sporting club or organisation","<strong>Follow up</strong> a conversation already in the document that needs a next step","<strong>Update the document</strong> with anything new since the last shift","<strong>WHAT GOES IN THE DOCUMENT:</strong>","Local businesses contacted or visited, and the outcome","Potential collaborations and partnership opportunities (businesses, influencers, etc.)","Community groups, sporting clubs or organisations reached out to","Events, activations or opportunities to get STRONG involved in the local community","Follow-ups required and where each conversation is up to","<strong>LINK TO CAMPAIGNS:</strong>","Where a campaign in the Campaigns & Events doc calls for local business involvement (e.g. Open Weekend partners), that outreach is logged here too","Look at what other studios have in the document — ideas that work in one area often work in another"],"why":"Grassroots is how a studio becomes part of its suburb rather than just a shopfront in it. A live document across all five studios means nothing gets lost between shifts, nobody contacts the same business twice, and good ideas travel."},"rostering":{"title":"Rostering & Scheduling","description":"Weekly review of all rosters and the class schedule so next week is covered and trainers know about any changes.","items":["<strong>ROSTERS:</strong>","Review next week's creche, cleaning and towel folding rosters for completeness","Identify any gaps, absences or unfilled shifts","Reach out to team members to coordinate covers if needed","Confirm all shifts are adequately staffed and notify relevant parties of any changes","<strong>DEPUTY & CLASS COVER:</strong>","Review Deputy roster updates and any class cover changes for the coming weeks","<strong>CLASS SCHEDULE:</strong>","Update the Hapana schedule to match: trainer names on all classes, any time or format changes","Ensure the schedule is accurate for the next 2+ weeks","Communicate relevant changes to trainers, and to members via community chat or social where needed","Verify with management before publishing major changes"],"why":"Creche, towels and cleaning are member-facing services, and trainer names on classes are a basic standard. Getting ahead of gaps on Friday means the weekend and the following week run smoothly."},"eosr_lep":{"title":"FOH EOSR","description":"The EOSR is your end-of-shift report — sent as a single WhatsApp message to the FOH team chat. It creates continuity, accountability and visibility across the whole team. Done well, it takes 5-10 minutes. The best way to do this is to fill it out as you go through your shift — it follows the same order as your daily tasks, so there's no scrambling at the end. Be specific with names, numbers and outcomes. Don't write \"yes\" or \"done\" — write what actually happened. If you missed something, note it and action it — the EOSR is how you catch things before they fall through the cracks.","items":["<strong>Fill this out as you go through your shift</strong> — it acts as a checklist as you work, and should take no longer than 5-10 minutes to finalise if done that way","Copy the EOSR template below into your notes at the start of the shift and fill it in as you go","Complete all sections — do not skip any, even if just to note \"N/A — reason\"","Be specific: use names, numbers and outcomes — not \"yes\", \"done\" or \"completed\"","If you missed something during your shift — note it, flag it, and action it before sending","Review what you've written before sending — ask yourself: would the next shift know exactly where things are at?","Send as ONE message to FOH team chat (send right at end of shift)"],"why":"The FOH EOSR is the last and one of the most important tasks of the shift. A detailed, honest report creates operational continuity and accountability — it prevents things from falling through the cracks, gives the whole team visibility into daily operations, and ensures the next shift starts fully informed with nothing lost in the handover. It also gives you visibility on areas you may have missed, highlights where you're consistently doing well, and keeps focus on what matters most.","template":"FOH END OF SHIFT REPORT – [DATE] – [STUDIO]\nShift: AM / PM\nFOH Staff:\n\n1. STUDIO SETUP & PRESENTATION\n(Reception, studio and bathrooms clean, tidy and member-ready. Temperature, music and amenities checked.)\nComplete? Yes / No\nNotes:\n\n2. DAILY PREP & MEMBER EXPERIENCE\n(Daily Schedule Report sent: first-timers, Intro Offers, high-risk, milestones, birthdays, new injuries. Trainer EOSRs reviewed.)\nComplete? Yes / No\nNotes:\n\n3. COMMUNITY & ADMIN\n(Community chats, Instagram DMs, Operandio, management WhatsApp, studio email.)\nComplete? Yes / No\nNotes:\n\n4. RECOVR – RETENTION & ENGAGEMENT\nDaily Briefing actioned? Yes / No\nHigh risk called (names / outcomes):\nMedium risk contacted:\nInbox cleared? Yes / No\nNext Up worked? Yes / No\nMembers needing management attention:\nWho did you get to know today (goals, life, roadblocks)?\nNotes:\n\n5. SOCIAL MEDIA\n(Stories posted, members tagged, DMs and comments actioned.)\nStories posted: __ / 4\nNotes:\n\n6. CAMPAIGNS & EVENTS\n(Campaigns & Events doc checked, tasks due actioned, studio column ticked.)\nComplete? Yes / No\nNotes:\n\n7. GRASSROOTS & LOCAL AREA MARKETING\n(Reached out / followed up / updated the document — which, and who?)\nAction taken:\nNotes:\n\n8. STUDIO RESET\n(Reception, bathrooms, dumbbells and equipment reset, supplies restocked.)\nComplete? Yes / No\nMaintenance / supply issues to report:\n\n9. WEEKLY TASK\nTask:\nCompleted? Yes / No / N/A\nNotes:\n\n10. HANDOVER & OUTSTANDING ACTIONS\nNotes:\n\nLEPPINGTON ONLY – PIPELINE\nLeads / Other promotions / Intro Offers (stages up to date?):\nMemberships sold:"},"eosr_pn":{"title":"FOH EOSR","description":"The EOSR is your end-of-shift report — sent as a single WhatsApp message to the FOH team chat. It creates continuity, accountability and visibility across the whole team. Done well, it takes 5-10 minutes. The best way to do this is to fill it out as you go through your shift — it follows the same order as your daily tasks, so there's no scrambling at the end. Be specific with names, numbers and outcomes. Don't write \"yes\" or \"done\" — write what actually happened. If you missed something, note it and action it — the EOSR is how you catch things before they fall through the cracks.","items":["<strong>Fill this out as you go through your shift</strong> — it acts as a checklist as you work, and should take no longer than 5-10 minutes to finalise if done that way","Copy the EOSR template below into your notes at the start of the shift and fill it in as you go","Complete all sections — do not skip any, even if just to note \"N/A — reason\"","Be specific: use names, numbers and outcomes — not \"yes\", \"done\" or \"completed\"","If you missed something during your shift — note it, flag it, and action it before sending","Review what you've written before sending — ask yourself: would the next shift know exactly where things are at?","Send as ONE message to FOH team chat (send right at end of shift)"],"why":"The FOH EOSR is the last and one of the most important tasks of the shift. A detailed, honest report creates operational continuity and accountability — it prevents things from falling through the cracks, gives the whole team visibility into daily operations, and ensures the next shift starts fully informed with nothing lost in the handover. It also gives you visibility on areas you may have missed, highlights where you're consistently doing well, and keeps focus on what matters most.","template":"FOH END OF SHIFT REPORT – [DATE] – [STUDIO]\nShift: AM / PM\nFOH Staff:\n\n1. STUDIO SETUP & PRESENTATION\n(Reception, studio and bathrooms clean, tidy and member-ready. Temperature, music and amenities checked.)\nComplete? Yes / No\nNotes:\n\n2. DAILY PREP & MEMBER EXPERIENCE\n(STRONG and TYG Daily Schedule Reports sent: first-timers, Intro Offers, high-risk, milestones, birthdays, new injuries. Trainer EOSRs reviewed.)\nComplete? Yes / No\nNotes:\n\n3. COMMUNITY & ADMIN\n(Community chats, Instagram DMs, Operandio, management WhatsApp, studio email.)\nComplete? Yes / No\nNotes:\n\n4. RECOVR – RETENTION & ENGAGEMENT\nDaily Briefing actioned? Yes / No\nHigh risk called – STRONG:\nHigh risk called – TYG:\nMedium risk contacted:\nInbox cleared? Yes / No\nNext Up worked? Yes / No\nMembers needing management attention:\nWho did you get to know today (goals, life, roadblocks)?\nNotes:\n\n5. SOCIAL MEDIA\n(Stories posted, members tagged, DMs and comments actioned.)\nSTRONG stories posted: __ / 4\nTYG stories posted: __ / 8\nNotes:\n\n6. CAMPAIGNS & EVENTS\n(Campaigns & Events doc checked, tasks due actioned, studio column ticked.)\nComplete? Yes / No\nNotes:\n\n7. GRASSROOTS & LOCAL AREA MARKETING\n(Reached out / followed up / updated the document — which, and who?)\nAction taken:\nNotes:\n\n8. STUDIO RESET\n(Reception, bathrooms, dumbbells and equipment reset, supplies restocked. SUPPS closed, stocktake done, float reconciled.)\nComplete? Yes / No\nMaintenance / supply issues to report:\n\n9. WEEKLY TASK\nTask:\nCompleted? Yes / No / N/A\nNotes:\n\n10. HANDOVER & OUTSTANDING ACTIONS\nNotes:"}};
