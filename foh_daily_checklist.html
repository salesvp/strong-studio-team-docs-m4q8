const LOCS = { bankstown:'Bankstown', castle_hill:'Castle Hill', leppington:'Leppington', penrith:'Penrith', wetherill_park:'Wetherill Park' };
const DAYKEYS = ['sun','mon','tue','wed','thu','fri','sat'];
const DAYNAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const GROUPS = [
  ['daily','Every shift'], ['saturday','Weekend classes'], ['weekly','Today only'], ['pipeline','Leppington — sales pipeline'], ['ongoing','Ongoing — all shift, every shift']
];

let loc = localStorage.getItem('foh_loc') || 'bankstown';
let shift = localStorage.getItem('foh_shift') || 'am';
let viewDate = new Date(); viewDate.setHours(0,0,0,0);

const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const isToday = d => ymd(d) === ymd(new Date());
function isFirstOf(d, dayKey) { return DAYKEYS[d.getDay()] === dayKey && d.getDate() <= 7; }
function isLastOf(d, dayKey) {
  if (DAYKEYS[d.getDay()] !== dayKey) return false;
  const n = new Date(d); n.setDate(n.getDate()+7); return n.getMonth() !== d.getMonth();
}
const DEF = ['bankstown','leppington','wetherill_park'];
function hasPM(dayKey) {
  if (loc === 'penrith' || loc === 'castle_hill') return ['mon','tue','wed','thu','fri'].includes(dayKey);
  return ['mon','tue','wed','thu'].includes(dayKey);
}
function hasSunday() { return loc === 'penrith' || loc === 'castle_hill'; }
function shiftLabels() { return loc === 'penrith' ? {am:'Shift 1', pm:'Shift 2'} : {am:'AM', pm:'PM'}; }

function resolve(task, dayKey) {
  for (const v of task.variants) {
    const w = v.when || {};
    if (w.loc && !w.loc.includes(loc)) continue;
    if (w.days && !w.days.includes(dayKey)) continue;
    if (w.shift && w.shift !== shift) continue;
    if (w.lastOf && !isLastOf(viewDate, w.lastOf)) continue;
    if (w.firstOf && !isFirstOf(viewDate, w.firstOf)) continue;
    return v;
  }
  return null;
}

function tickKey() { return 'foh_ticks_' + loc + '_' + ymd(viewDate) + '_' + shift; }
function loadTicks() { try { return JSON.parse(localStorage.getItem(tickKey()) || '{}'); } catch(e) { return {}; } }
function saveTicks(t) { try { localStorage.setItem(tickKey(), JSON.stringify(t)); } catch(e) {} }
function purgeOld() {
  try {
    const keep = ymd(new Date(Date.now() - 7*86400000));
    Object.keys(localStorage).forEach(k => { if (k.startsWith('foh_ticks_') && k.split('_').slice(-2)[0] < keep) localStorage.removeItem(k); });
  } catch(e) {}
}

function esc(s) { return s; }
function detailHTML(d) {
  let h = '<div class="task-body-inner">';
  h += '<p class="intro">' + d.description + '</p><ul class="checklist">';
  d.items.forEach(i => {
    const isHd = /^<strong>[^<]*:<\/strong>$/.test(i.trim());
    h += '<li' + (isHd ? ' class="hd"' : '') + '><span>' + i + '</span></li>';
  });
  h += '</ul>';
  if (d.template) h += '<div class="copy-block"><div class="copy-block-type">EOSR template — copy and paste into your notes</div><button class="copy-btn" onclick="copyTpl(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>Copy</button><div class="copy-block-content">' + d.template.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</div></div>';
  if (d.why) h += '<div class="callout info"><div><strong class="cl">Why this matters</strong>' + d.why + '</div></div>';
  if (d.specialNote) h += '<div class="callout warning"><div>' + d.specialNote + '</div></div>';
  h += '</div>';
  return h;
}

function render() {
  const openIds = [...document.querySelectorAll('.task.open')].map(e => e.id);
  const dayKey = DAYKEYS[viewDate.getDay()];
  // single-shift days force AM
  const single = !hasPM(dayKey);
  if (single) shift = 'am';
  const labels = shiftLabels();
  document.getElementById('shiftText').textContent = labels[shift];
  document.getElementById('shiftPill').style.display = single ? 'none' : 'flex';
  document.getElementById('locText').textContent = LOCS[loc];
  document.getElementById('crumbLoc').textContent = LOCS[loc];
  document.getElementById('dayTitle').innerHTML = DAYNAMES[viewDate.getDay()] + ' <em>' + viewDate.getDate() + ' ' + MONTHS[viewDate.getMonth()] + '</em>';
  document.getElementById('todayBtn').style.display = isToday(viewDate) ? 'none' : 'inline-block';
  document.getElementById('shiftMenu').innerHTML = ['am','pm'].map(s => '<div class="' + (s===shift?'sel':'') + '" onclick="setShift(\'' + s + '\')">' + labels[s] + '</div>').join('');
  const locMenuHtml = Object.keys(LOCS).map(k => '<div class="' + (k===loc?'sel':'') + '" onclick="setLoc(\'' + k + '\')">' + LOCS[k] + '</div>').join('');
  document.getElementById('locMenu').innerHTML = locMenuHtml;
  document.getElementById('locMenu2').innerHTML = locMenuHtml;

  const ticks = loadTicks();
  let total = 0, done = 0, html = '';
  if (dayKey === 'sun' && !hasSunday()) {
    html = '<div class="section-label">No shift</div><div class="empty">' + LOCS[loc] + ' does not run a Sunday FOH shift.</div>';
  } else {
    GROUPS.forEach(([g, label]) => {
      const rows = [];
      TASKS.filter(t => t.group === g).forEach(t => {
        const v = resolve(t, dayKey);
        if (!v || v.skip) return;
        const d = DET[v.detail]; if (!d) return;
        const title = v.title || t.title, desc = v.desc || t.desc;
        const badges = [];
        if (t.badge) badges.push('<span class="badge ' + t.badge + '">' + t.badge + '</span>');
        if (t.group === 'pipeline') badges.push('<span class="badge pipeline">Leppington only</span>');
        if (t.offroster) badges.push('<span class="badge offroster">Do on this day even if not rostered</span>');
        const countable = g !== 'ongoing';
        const isDone = countable && !!ticks[t.id];
        if (countable) { total++; if (isDone) done++; }
        rows.push('<div class="task' + (isDone ? ' done' : '') + '" id="task-' + t.id + '">' +
          '<div class="task-row" onclick="toggleOpen(\'' + t.id + '\')">' +
          (countable ? '<div class="tick" onclick="toggleTick(event,\'' + t.id + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></div>' : '') +
          '<div class="task-label"><div class="acc-title">' + title + '</div><div class="acc-desc">' + desc + '</div>' + (badges.length ? '<div class="badges">' + badges.join('') + '</div>' : '') + '</div>' +
          '<div class="accordion-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg></div>' +
          '</div><div class="task-body">' + detailHTML(d) + '</div></div>');
      });
      if (!rows.length) return;
      html += '<div class="section-label">' + label + (g !== 'ongoing' ? ' <span class="count">' + rows.length + '</span>' : '') + '</div>' + rows.join('');
    });
    html += '<div class="foot"><div class="note">Ticks are saved on this device for today only and clear automatically tomorrow.<br>You manage your own time across the 3-hour shift. If the list isn\'t manageable, raise it with management.</div><button class="reset-btn" onclick="resetTicks()">Reset today</button></div>';
  }
  document.getElementById('content').innerHTML = html;
  openIds.forEach(id => { const e = document.getElementById(id); if (e) e.classList.add('open'); });
  const pp = document.getElementById('progressPill');
  pp.textContent = done + ' of ' + total + ' done';
  pp.className = 'meta-pill ' + (total && done === total ? 'done' : 'highlight');
  document.getElementById('hoursPill').textContent = (single ? 'Single shift' : labels[shift] + ' shift') + ' · 3 hours';
}

function copyTpl(btn) {
  const text = btn.parentElement.querySelector('.copy-block-content').innerText;
  const done = () => { btn.classList.add('copied'); btn.lastChild.textContent = 'Copied'; setTimeout(() => { btn.classList.remove('copied'); btn.lastChild.textContent = 'Copy'; }, 1800); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); done(); } catch(e) {} document.body.removeChild(ta);
}
function toggleOpen(id) { document.getElementById('task-' + id).classList.toggle('open'); }
function toggleTick(e, id) {
  e.stopPropagation();
  const t = loadTicks(); if (t[id]) delete t[id]; else t[id] = Date.now(); saveTicks(t);
  render();
}
function resetTicks() { if (confirm('Clear all ticks for this shift?')) { saveTicks({}); render(); } }
function setShift(s) { shift = s; localStorage.setItem('foh_shift', s); closeMenus(); render(); }
function setLoc(l) { loc = l; localStorage.setItem('foh_loc', l); closeMenus(); render(); }
function shiftDay(n) { viewDate.setDate(viewDate.getDate() + n); render(); }
function goToday() { viewDate = new Date(); viewDate.setHours(0,0,0,0); render(); }
function toggleMenu(e, id) { e.stopPropagation(); const m = document.getElementById(id); const was = m.classList.contains('open'); closeMenus(); if (!was) m.classList.add('open'); }
function closeMenus() { document.querySelectorAll('.tb-menu').forEach(m => m.classList.remove('open')); }
document.addEventListener('click', closeMenus);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !isToday(viewDate)) { /* keep planning view */ } });
purgeOld();
render();
</script>
